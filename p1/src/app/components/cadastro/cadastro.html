<div class="container my-5" style="max-width: 500px;">
  <div class="card shadow p-4 rounded-3">
    <h3 class="text-center mb-4">Criar Conta</h3>

    <div *ngIf="mensagemErro" class="alert alert-danger">{{ mensagemErro }}</div>
    <div *ngIf="mensagemSucesso" class="alert alert-success">{{ mensagemSucesso }}</div>

    <form (ngSubmit)="cadastrar()">
      <div class="mb-3">
        <label class="form-label">Nome Completo *</label>
        <input type="text" class="form-control" [(ngModel)]="novoCliente.nome" name="nome" required>
      </div>

      <div class="mb-3">
        <label class="form-label">E-mail *</label>
        <input type="email" class="form-control" [(ngModel)]="novoCliente.email" name="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Palavra-passe *</label>
        <input type="password" class="form-control" [(ngModel)]="novoCliente.senha" name="senha" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" class="form-control" [(ngModel)]="novoCliente.telefone" name="telefone">
      </div>

      <div class="mb-3">
        <label class="form-label">Morada</label>
        <input type="text" class="form-control" [(ngModel)]="novoCliente.morada" name="morada">
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold">Registar</button>
    </form>

    <div class="text-center mt-3">
      <small>Já tem conta? <a routerLink="/login">Faça Login</a></small>
    </div>
  </div>
</div>
