spring.application.name=demo
# URL de Conexão (troque 'lojinha_db' pelo nome do seu banco de dados)
spring.datasource.url=jdbc:postgresql://localhost:5050/lojinha_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
# 'update' cria ou atualiza as tabelas automaticamente com base nas suas entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect