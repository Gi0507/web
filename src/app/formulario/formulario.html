<h1 style="color: red;">Contato</h1>

<h2>Seja bem vindo prencher o formulário a baixo para:</h2>

<ul>
  <li>Duvidas</li>
  <li>Sugestões</li>
  <li>Criticas</li>
  <li>Orçamentos</li>
</ul>


Caso queira ver nossos produtos clique <a href="/produtos">aqui</a><br>
Nome: <input type="text" name="nome" id="nome" placeholder="Digite seu nome"><br>
E-mail: <input type="email" name="email" id="email" placeholder="Digite seu email"><br>
telefone: <input type="tel" name="telefone" id="telefone" placeholder="Digite seu telefone" pattern="[0-9]{5}-[0-9]{4}"><br>


Assunto: <select name="assunto" id="assunto">
  <option value="duvidas">Duvidas</option>
  <option value="sugestoes">Sugestões</option>
  <option value="criticas">Criticas</option>
  <option value="orcamentos">Orçamentos</option>
</select><br>


Deseja receber uma copia deste e-mail?
<input type="radio" name="copia" id="sim" value="sim">Sim
<input type="radio" name="copia" id="nao" value="nao">Não<br>


mensagem: <textarea name="mensagem" id="mensagem" cols="30" rows="10" placeholder="Digite sua mensagem"></textarea><br>
<button type="submit">Enviar</button>
