<h3>doação de sangue</h3>


nome:<input type="text" id="nome" 
placeholder="Digite seu nome completo"required><br>
email:<input type="email" id="email"
placeholder="Digite seu email" required><br>    
password:<input type="password" id="senha"
placeholder="Digite sua senha" required><br>
idade:<input type="number" id="idade"
placeholder="Digite sua idade" min="18"
max="65" required><br>
peso:<input type="number" id="peso"
placeholder="Digite seu peso" min="50" max="200" required><br>
data de nascimento:<input type="date" id="data" required><br>


tipo sanguineo:<select id="opap" required>
  <option value="">Selecione...</option>
  <option value="A+">A+</option>
  <option value="A-">A-</option>
  <option value="B+">B+</option>
  <option value="B-">B-</option>
  <option value="AB+">AB+</option>
  <option value="AB-">AB-</option>
  <option value="O+">O+</option>
  <option value="O-">O-</option>
</select><br> 


sexo:<br>
<input type ="radio" name="sexo" value="masculino" required>Masculino
<input type ="radio" name="sexo" value="feminino" required>Feminino<br>


condiçoes:<br>
<input type="checkbox" id ="sangue">Duou sangue nos ultimos 6 meses?<br>
<input type="checkbox" id ="gravida">Esta gravida?<br>
<input type="checkbox" id ="Alcool">Ingeriu álcool nos últimos 3 dias?<br>
<input type="checkbox" id ="tatuagem">Fez tatuagem nos ultimos 3 meses?<br>


mensagem:<br>
<textarea id="mensagem" id="msg" rows="4" cols="50" right placeholder="Conte sobre voce..."></textarea><br>

telefone:<input type="text" id="telefone" name="telefone" pattern="[0-9]{4,5}[0-9]{4}"
placeholder="Digite seu telefone" required><br>
<button>Enviar</button>
